# ============================================
# OPTION 1: FULLY AUTOMATED PIPELINE
# ============================================
# Flow: lint → dev → qa → stage → prod (automatic)
# Trigger: Push to develop/main branches, cron schedule
# Reports: Published to GitHub Pages
# ✅ ESLint static code analysis
# ✅ Playwright browsers cached for faster runs
# ✅ Allure environment labels for separation
# ✅ Slack notifications for test results
# ✅ Email notifications (any domain)
# ============================================
#
# Required Secrets for Notifications:
# ------------------------------------
# SLACK_WEBHOOK_URL    - Slack Incoming Webhook URL
# MAIL_SERVER          - SMTP server (e.g., smtp.gmail.com, smtp.office365.com)
# MAIL_PORT            - SMTP port (e.g., 587 for TLS, 465 for SSL)
# MAIL_USERNAME        - SMTP username/email
# MAIL_PASSWORD        - SMTP password or app password
# MAIL_FROM            - Sender email address
# NOTIFICATION_EMAILS  - Comma-separated recipient emails (any domain)
# ============================================

name: New Playwright Auto Pipeline Teams acpt & Prod

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

# ============================================
# 🔍 LINT
# ============================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: mkdir -p eslint-report

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - run: npm run lint:report
        if: always()

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eslint-report
          path: eslint-report/

# ============================================
# 🔍 ACPT TESTS
# ============================================
  acpt-tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps

      - run: rm -rf allure-results playwright-report playwright-html-report test-results

      - name: Run ACPT tests
        run: npx playwright test tests/OrangeHRM.spec.ts --config=playwright.config.acpt.ts
        env:
          CI: true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: acpt-artifacts
          path: |
            playwright-report/
            playwright-html-report/
            allure-results/

# ============================================
# 🚀 PROD TESTS
# ============================================
  prod-tests:
    runs-on: ubuntu-latest
    needs: acpt-tests

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps

      - run: rm -rf allure-results playwright-report playwright-html-report test-results

      - name: Run PROD tests
        run: npx playwright test tests/OrangeHRM.spec.ts --config=playwright.config.prod.ts
        env:
          CI: true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: prod-artifacts
          path: |
            playwright-report/
            playwright-html-report/
            allure-results/

# ============================================
# 📊 REPORT PUBLISH (MODERN)
# ============================================
  publish:
    runs-on: ubuntu-latest
    needs: [acpt-tests, prod-tests]
    if: always()

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: reports

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure
        run: |
          curl -Ls https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.24.0/allure-commandline-2.24.0.tgz | tar zx
          echo "$PWD/allure-2.24.0/bin" >> $GITHUB_PATH

      - name: Generate Allure Reports
        run: |
          mkdir -p site/acpt site/prod

          if [ -d "reports/acpt-artifacts/allure-results" ]; then
            allure generate reports/acpt-artifacts/allure-results -o site/acpt --clean
          fi

          if [ -d "reports/prod-artifacts/allure-results" ]; then
            allure generate reports/prod-artifacts/allure-results -o site/prod --clean
          fi

      - name: Create index
        run: |
          cat > site/index.html << EOF
          <h1>Playwright Reports</h1>
          <ul>
            <li><a href="./acpt/index.html">ACPT Report</a></li>
            <li><a href="./prod/index.html">PROD Report</a></li>
          </ul>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - uses: actions/deploy-pages@v4

# ============================================
# 📬 NOTIFICATIONS (TEAMS + EMAIL)
# ============================================
  notify:
    runs-on: ubuntu-latest
    needs: [acpt-tests, prod-tests, publish]
    if: always()

    steps:

      - name: Determine Status
        id: status
        run: |
          ACPT="${{ needs.acpt-tests.result }}"
          PROD="${{ needs.prod-tests.result }}"

          if [[ "$ACPT" == "success" && "$PROD" == "success" ]]; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "color=00FF00" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "color=FF0000" >> $GITHUB_OUTPUT
          fi

      # 🟦 TEAMS
      - name: Send Teams Notification
        if: ${{ secrets.TEAMS_WEBHOOK_URL != '' }}
        run: |
          curl -H "Content-Type: application/json" -d "{
            \"@type\": \"MessageCard\",
            \"@context\": \"http://schema.org/extensions\",
            \"themeColor\": \"${{ steps.status.outputs.color }}\",
            \"title\": \"Pipeline: ${{ steps.status.outputs.status }}\",
            \"sections\": [{
              \"facts\": [
                {\"name\": \"Repo\", \"value\": \"${{ github.repository }}\"},
                {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"},
                {\"name\": \"ACPT\", \"value\": \"${{ needs.acpt-tests.result }}\"},
                {\"name\": \"PROD\", \"value\": \"${{ needs.prod-tests.result }}\"}
              ]
            }]
          }" ${{ secrets.TEAMS_WEBHOOK_URL }}

      # 📧 EMAIL (NO DEPRECATED ACTION)
      - name: Send Email
        if: ${{ secrets.MAIL_SERVER != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y msmtp mailutils

          cat > ~/.msmtprc <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt

          account default
          host ${{ secrets.MAIL_SERVER }}
          port ${{ secrets.MAIL_PORT }}
          from ${{ secrets.MAIL_FROM }}
          user ${{ secrets.MAIL_USERNAME }}
          password ${{ secrets.MAIL_PASSWORD }}
          EOF

          chmod 600 ~/.msmtprc

          echo "Pipeline: ${{ steps.status.outputs.status }}
ACPT: ${{ needs.acpt-tests.result }}
PROD: ${{ needs.prod-tests.result }}

- name: Send Email
  if: ${{ secrets.MAIL_SERVER != '' }}
  run: |
    sudo apt-get update
    sudo apt-get install -y msmtp mailutils

    cat > ~/.msmtprc <<EOF
    defaults
    auth on
    tls on
    tls_trust_file /etc/ssl/certs/ca-certificates.crt

    account default
    host ${{ secrets.MAIL_SERVER }}
    port ${{ secrets.MAIL_PORT }}
    from ${{ secrets.MAIL_FROM }}
    user ${{ secrets.MAIL_USERNAME }}
    password ${{ secrets.MAIL_PASSWORD }}
    EOF

    chmod 600 ~/.msmtprc

    cat <<EOF | mail -s "Playwright Pipeline Result" ${{ secrets.NOTIFICATION_EMAILS }}
Pipeline: ${{ steps.status.outputs.status }}
ACPT: ${{ needs.acpt-tests.result }}
PROD: ${{ needs.prod-tests.result }}

Reports:
https://cdpaiassistance-arch.github.io/PSMDemo/
EOF